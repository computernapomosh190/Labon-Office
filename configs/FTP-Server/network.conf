config interface 'loopback'
	option device 'lo'
	option proto 'static'
	list ipaddr '127.0.0.1/8'

config globals 'globals'
	option dhcp_default_duid '000434736b6fea7640a5b9ce7e0265fc815b'
	option ula_prefix 'fd8c:3b70:27fb::/48'

config device
	option name 'br-lan'
	option type 'bridge'
	list ports 'eth0'

config interface 'lan'
	option device 'br-lan'
	option proto 'static'
	list ipaddr '126.168.10.3/24'
	option gateway '192.168.10.1'
	option dns '8.8.8.8'
