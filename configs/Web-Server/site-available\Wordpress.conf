server {
    listen 8082;
    server_name 192.168.10.2 labon.com ://labon.com;
    root /var/www/labon.com;
    index index.php index.html index.htm;

    charset utf-8;

    # Логи
    access_log /var/log/nginx/your_domain.com.access.log;
    error_log /var/log/nginx/your_domain.com.error.log;

    # ЧПУ (Pretty URLs) для WordPress
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Обробка PHP-скриптів через FastCGI
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock; # Вкажіть вашу версію PHP
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

  # Заборона доступу до прихованих файлів (наприклад, .htaccess)
    location ~ /\.ht {
        deny all;
    }

    # Оптимізація кешування статики
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires max;
        log_not_found off;
    }
}
