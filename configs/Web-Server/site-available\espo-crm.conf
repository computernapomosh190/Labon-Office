server {
    listen 8081;
    server_name 192.168.10.2; # IP вашого сервера

    root /var/www/html/espocrm/public;
    index index.php index.html index.htm;

    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Добавьте этот блок для обработки API-запросов CRM
    location /api/v1/ {
        try_files $uri $uri/ /api/v1/index.php?$args;
    }


    location /client/ {
        alias /var/www/html/espocrm/client/;
    }
    # Передача PHP-скриптів інтерпретатору 
      
    # Передача PHP-скриптів інтерпретатору (перевірте версію php-fpm у вашій системі)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock; # або php8.3-fpm.sock залежно від версії
    }

    location ~ /\.ht {
        deny all;
    }
}

